<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>For You ❤️</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09060a}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{-webkit-appearance:none;appearance:none;font:inherit}#app{position:fixed;inset:0;height:100vh;height:100dvh;color:#fff;background:radial-gradient(circle at 50% 25%,#5a3440,#25151d 42%,#09060a 88%);overflow:hidden}.page{position:absolute;inset:0;transition:opacity .35s,visibility .35s}.off{opacity:0;visibility:hidden;pointer-events:none!important}#lock{z-index:30;touch-action:manipulation}.locktop{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:0;right:0;text-align:center;pointer-events:none}.lockicon{font-size:19px;margin-bottom:8px}#clock{font-size:min(25vw,102px);font-weight:200;letter-spacing:-5px;line-height:.95}#day{font-size:18px;font-weight:500;margin-top:12px}.unlock{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 30px);text-align:center;pointer-events:none}.unlock span{display:inline-block;padding:12px 20px;border-radius:999px;border:1px solid #ffffff66;background:#0004;font-weight:600;animation:b 1.5s infinite}@keyframes b{50%{transform:scale(1.055);background:#ffffff22}}#pass{z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 22%,#50303a,#21141a 58%,#080609)}.passwrap{width:100%;max-width:350px;text-align:center}.title{font-size:22px;font-weight:600}.subtitle{font-size:14px;opacity:.72;margin:7px 0 21px}.dots{display:flex;justify-content:center;gap:13px;margin-bottom:24px}.dot{width:12px;height:12px;border:1.7px solid #fff;border-radius:50%}.dot.on{background:#fff}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 18px;justify-content:center}.key{width:72px;height:72px;padding:0;border-radius:50%;border:1px solid #ffffff66;background:#ffffff1a;color:#fff;font-size:28px;font-weight:300;touch-action:manipulation}.key:active{background:#ffffff55;transform:scale(.96)}.blank{visibility:hidden}.delete{font-size:13px;font-weight:600}#error{height:20px;margin-top:13px;font-size:14px;color:#ffd5dd;opacity:0}#error.show{opacity:1}#reveal{z-index:20;background:radial-gradient(circle at 50% 42%,#623a46,#24141c 60%,#09060a)}.message{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;opacity:0;transform:scale(.94);transition:opacity 1.25s .72s,transform 1.35s .72s}#reveal.go .message{opacity:1;transform:scale(1)}.card{max-width:590px;padding:36px 24px;border-radius:30px;border:1px solid #ffffff38;background:#fff8f217}.words{font-family:Georgia,serif;font-size:clamp(29px,8vw,47px);line-height:1.28;text-shadow:0 2px 15px #0006}.kiss{font-size:54px;margin-top:20px}.flowers{position:absolute;z-index:10;inset:-8%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(10,1fr);place-items:center;pointer-events:none}.flower{font-size:min(13vw,75px);line-height:1;transform:rotate(var(--rot)) scale(1.2);transition:transform 2s cubic-bezier(.7,0,.18,1),opacity 1.45s}#reveal.go .left{transform:translate3d(-130vw,0,0) rotate(-40deg) scale(.8);opacity:.08}#reveal.go .right{transform:translate3d(130vw,0,0) rotate(40deg) scale(.8);opacity:.08}</style></head><body><div id="app"><section id="reveal" class="page off"><div class="message"><div class="card"><div class="words">I love you more than life itself.<br><br>Yours forever</div><div class="kiss">💋</div></div></div><div class="flowers" id="flowers"></div></section><section id="lock" class="page"><div class="locktop"><div class="lockicon">🔒</div><div id="clock">9:41</div><div id="day"></div></div><div class="unlock"><span>Tap to unlock ♡</span></div></section><section id="pass" class="page off"><div class="passwrap"><div class="title">Enter Passcode</div><div class="subtitle">Enter the 6-digit passcode</div><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="pad"><button class="key" data-d="1">1</button><button class="key" data-d="2">2</button><button class="key" data-d="3">3</button><button class="key" data-d="4">4</button><button class="key" data-d="5">5</button><button class="key" data-d="6">6</button><button class="key" data-d="7">7</button><button class="key" data-d="8">8</button><button class="key" data-d="9">9</button><span class="key blank"></span><button class="key" data-d="0">0</button><button class="key delete" id="del">Delete</button></div><div id="error">Incorrect passcode</div></div></section></div><script>(function(){'use strict';var lock=document.getElementById('lock'),pass=document.getElementById('pass'),reveal=document.getElementById('reveal'),dots=document.querySelectorAll('.dot'),err=document.getElementById('error'),code='';function clock(){var d=new Date(),h=d.getHours()%12||12,m=('0'+d.getMinutes()).slice(-2),ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['January','February','March','April','May','June','July','August','September','October','November','December'];document.getElementById('clock').textContent=h+':'+m;document.getElementById('day').textContent=ds[d.getDay()]+', '+ms[d.getMonth()]+' '+d.getDate()}clock();setInterval(clock,30000);var g=document.getElementById('flowers'),bl=['🌹','🌸','🌹','🌺','🪷','🌹','🌸'];for(var i=0;i<70;i++){var f=document.createElement('div'),c=i%7;f.className='flower '+(c<3?'left':c>3?'right':i%2?'left':'right');f.textContent=bl[(i*5+i%3)%bl.length];f.style.setProperty('--rot',(((i*37)%31)-15)+'deg');g.appendChild(f)}function show(e){if(e){e.preventDefault();e.stopPropagation()}lock.classList.add('off');pass.classList.remove('off')}function tap(el,fn){var t=false;el.addEventListener('touchend',function(e){t=true;fn(e);setTimeout(function(){t=false},450)},{passive:false});el.addEventListener('click',function(e){if(!t)fn(e)})}tap(lock,show);function paint(){for(var i=0;i<6;i++)dots[i].classList.toggle('on',i<code.length)}function digit(n){if(code.length>=6)return;err.classList.remove('show');code+=n;paint();if(code.length===6)setTimeout(function(){if(code==='240998'){pass.classList.add('off');reveal.classList.remove('off');requestAnimationFrame(function(){requestAnimationFrame(function(){reveal.classList.add('go')})})}else{code='';paint();err.classList.add('show')}},140)}document.querySelectorAll('[data-d]').forEach(function(k){tap(k,function(e){e.preventDefault();e.stopPropagation();digit(k.getAttribute('data-d'))})});tap(document.getElementById('del'),function(e){e.preventDefault();e.stopPropagation();code=code.slice(0,-1);paint();err.classList.remove('show')})})();</script></body></html>
